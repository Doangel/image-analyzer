name: Convertir video a HLS

on:
  repository_dispatch:
    types: [convertir_video]

jobs:
  convertir:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        video_id: ${{ fromJson(toJson(github.event.client_payload.video_ids)) }}
    steps:
      - name: Instalar ffmpeg y jq
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg jq

      - name: Instalar AWS CLI (para hablar con R2)
        run: |
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q -o awscliv2.zip
          sudo ./aws/install --update

      - name: Configurar credenciales de R2
        run: |
          mkdir -p ~/.aws
          cat <<CREDS > ~/.aws/credentials
          [default]
          aws_access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CREDS
          echo "[default]" > ~/.aws/config
          echo "region = auto" >> ~/.aws/config

      - name: Pedirle al sitio los datos de este video
        run: |
          curl -sfvk "https://vixyra.vip/api-conversion.php?id=${{ matrix.video_id }}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" \
            -H "X-Secret: ${{ secrets.CONVERT_SECRET }}" \
            -o info.json

          # Si lo que llegó no es JSON válido, mostramos el contenido real
          # tal cual llegó (para poder ver si fue una página de bloqueo,
          # un error de PHP, etc.) en vez de fallar a ciegas más adelante.
          if ! jq -e . info.json > /dev/null 2>&1; then
            echo "::error::info.json no es JSON válido. Contenido real recibido:"
            cat info.json
            exit 1
          fi
          cat info.json

      - name: Descargar el archivo crudo desde R2
        run: |
          OBJECT_KEY=$(jq -r '.video_object_key' info.json)
          echo "OBJECT_KEY=$OBJECT_KEY" >> "$GITHUB_ENV"

          # Guardamos el archivo local con la MISMA extensión que subió el
          # usuario (mp4, mov, webm, mkv, lo que sea) — ffmpeg igual detecta
          # el formato por el contenido, pero así evitamos casos raros donde
          # una extensión equivocada confunde al demuxer.
          EXTENSION="${OBJECT_KEY##*.}"
          echo "EXTENSION=$EXTENSION" >> "$GITHUB_ENV"

          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/$OBJECT_KEY" "video_original.$EXTENSION" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      - name: Convertir a HLS con ffmpeg (480p, 720p y 1080p)
        run: |
          mkdir -p hls_output/480p hls_output/720p hls_output/1080p

          # -2 mantiene la relación de aspecto ajustando el ancho a un número par.
          # Si el video original es más chico que alguna de estas calidades, ffmpeg
          # igual la genera (quedaría "estirada" un poco) — si preferís que solo
          # genere las calidades que el video realmente alcanza, decime y lo
          # ajustamos para que detecte la resolución de origen primero.
          ffmpeg -i "video_original.$EXTENSION" \
            -filter_complex "[0:v]split=3[v1][v2][v3]; \
              [v1]scale=w=-2:h=480[v1out]; \
              [v2]scale=w=-2:h=720[v2out]; \
              [v3]scale=w=-2:h=1080[v3out]" \
            -map "[v1out]" -c:v:0 libx264 -preset veryfast -crf 23 -b:v:0 800k  -maxrate:v:0 856k  -bufsize:v:0 1200k \
            -map "[v2out]" -c:v:1 libx264 -preset veryfast -crf 21 -b:v:1 2800k -maxrate:v:1 2996k -bufsize:v:1 4200k \
            -map "[v3out]" -c:v:2 libx264 -preset veryfast -crf 20 -b:v:2 5000k -maxrate:v:2 5350k -bufsize:v:2 7500k \
            -map a:0 -c:a:0 aac -b:a:0 96k \
            -map a:0 -c:a:1 aac -b:a:1 128k \
            -map a:0 -c:a:2 aac -b:a:2 128k \
            -f hls -hls_time 6 -hls_playlist_type vod \
            -hls_segment_filename "hls_output/%v/segmento_%03d.ts" \
            -master_pl_name master.m3u8 \
            -var_stream_map "v:0,a:0,name:480p v:1,a:1,name:720p v:2,a:2,name:1080p" \
            hls_output/%v/playlist.m3u8

      - name: Subir carpeta HLS a R2
        run: |
          aws s3 cp hls_output "s3://${{ secrets.R2_BUCKET }}/hls/${{ matrix.video_id }}/" \
            --recursive \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          echo "HLS_KEY=hls/${{ matrix.video_id }}/master.m3u8" >> "$GITHUB_ENV"

      - name: Borrar el archivo crudo de R2 (ya no hace falta)
        if: success()
        run: |
          aws s3 rm "s3://${{ secrets.R2_BUCKET }}/$OBJECT_KEY" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      - name: Avisarle al sitio que ya terminó
        if: always()
        run: |
          ESTADO="listo"
          if [ "${{ job.status }}" != "success" ]; then ESTADO="error"; fi
          curl -svk -X POST "https://vixyra.vip/api-conversion.php" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" \
            -H "Content-Type: application/json" \
            -H "X-Secret: ${{ secrets.CONVERT_SECRET }}" \
            -d "{\"video_id\": ${{ matrix.video_id }}, \"status\": \"$ESTADO\", \"hls_key\": \"$HLS_KEY\"}"
