name: Convertir video a HLS

on:
  repository_dispatch:
    types: [convertir_video]

jobs:
  convertir:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        video: ${{ fromJson(toJson(github.event.client_payload.videos)) }}
    steps:
      - name: Instalar ffmpeg y jq
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg jq

      - name: Instalar AWS CLI (para hablar con R2)
        run: |
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q -o awscliv2.zip
          sudo ./aws/install --update

      - name: Configurar credenciales de R2
        run: |
          mkdir -p ~/.aws
          cat <<CREDS > ~/.aws/credentials
          [default]
          aws_access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CREDS
          echo "[default]" > ~/.aws/config
          echo "region = auto" >> ~/.aws/config

      - name: Descargar el archivo crudo desde R2
        run: |
          OBJECT_KEY="${{ matrix.video.object_key }}"
          echo "OBJECT_KEY=$OBJECT_KEY" >> "$GITHUB_ENV"
          EXTENSION="${OBJECT_KEY##*.}"
          echo "EXTENSION=$EXTENSION" >> "$GITHUB_ENV"
          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/$OBJECT_KEY" "video_original.$EXTENSION" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      - name: Detectar resolución y convertir a HLS (solo calidades que el video alcanza)
        run: |
          SRC_HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "video_original.$EXTENSION")
          echo "Alto de origen detectado: ${SRC_HEIGHT}px"
          mkdir -p hls_output

          if [ "$SRC_HEIGHT" -ge 1080 ]; then
            echo "Generando 480p + 720p + 1080p"
            mkdir -p hls_output/480p hls_output/720p hls_output/1080p
            ffmpeg -i "video_original.$EXTENSION" \
              -filter_complex "[0:v]split=3[v0][v1][v2]; [v0]scale=w=-2:h=480[v0out]; [v1]scale=w=-2:h=720[v1out]; [v2]scale=w=-2:h=1080[v2out]" \
              -map "[v0out]" -c:v:0 libx264 -preset veryfast -crf 23 -b:v:0 800k  -maxrate:v:0 856k  -bufsize:v:0 1200k \
              -map "[v1out]" -c:v:1 libx264 -preset veryfast -crf 21 -b:v:1 2800k -maxrate:v:1 2996k -bufsize:v:1 4200k \
              -map "[v2out]" -c:v:2 libx264 -preset veryfast -crf 20 -b:v:2 5000k -maxrate:v:2 5350k -bufsize:v:2 7500k \
              -map a:0 -c:a:0 aac -b:a:0 96k \
              -map a:0 -c:a:1 aac -b:a:1 128k \
              -map a:0 -c:a:2 aac -b:a:2 128k \
              -f hls -hls_time 6 -hls_playlist_type vod \
              -hls_segment_filename "hls_output/%v/segmento_%03d.ts" \
              -master_pl_name master.m3u8 \
              -var_stream_map "v:0,a:0,name:480p v:1,a:1,name:720p v:2,a:2,name:1080p" \
              hls_output/%v/playlist.m3u8

          elif [ "$SRC_HEIGHT" -ge 720 ]; then
            echo "Generando 480p + 720p"
            mkdir -p hls_output/480p hls_output/720p
            ffmpeg -i "video_original.$EXTENSION" \
              -filter_complex "[0:v]split=2[v0][v1]; [v0]scale=w=-2:h=480[v0out]; [v1]scale=w=-2:h=720[v1out]" \
              -map "[v0out]" -c:v:0 libx264 -preset veryfast -crf 23 -b:v:0 800k  -maxrate:v:0 856k  -bufsize:v:0 1200k \
              -map "[v1out]" -c:v:1 libx264 -preset veryfast -crf 21 -b:v:1 2800k -maxrate:v:1 2996k -bufsize:v:1 4200k \
              -map a:0 -c:a:0 aac -b:a:0 96k \
              -map a:0 -c:a:1 aac -b:a:1 128k \
              -f hls -hls_time 6 -hls_playlist_type vod \
              -hls_segment_filename "hls_output/%v/segmento_%03d.ts" \
              -master_pl_name master.m3u8 \
              -var_stream_map "v:0,a:0,name:480p v:1,a:1,name:720p" \
              hls_output/%v/playlist.m3u8

          elif [ "$SRC_HEIGHT" -ge 480 ]; then
            echo "Generando solo 480p"
            mkdir -p hls_output/480p
            ffmpeg -i "video_original.$EXTENSION" \
              -vf "scale=w=-2:h=480" \
              -c:v libx264 -preset veryfast -crf 23 -b:v 800k -maxrate 856k -bufsize 1200k \
              -c:a aac -b:a 96k \
              -f hls -hls_time 6 -hls_playlist_type vod \
              -hls_segment_filename "hls_output/480p/segmento_%03d.ts" \
              hls_output/480p/playlist.m3u8
            printf '#EXTM3U\n#EXT-X-STREAM-INF:BANDWIDTH=856000\n480p/playlist.m3u8\n' > hls_output/master.m3u8

          else
            echo "Video más chico que 480p ($SRC_HEIGHT px), se respeta su tamaño original"
            mkdir -p hls_output/original
            ffmpeg -i "video_original.$EXTENSION" \
              -c:v libx264 -preset veryfast -crf 22 \
              -c:a aac -b:a 96k \
              -f hls -hls_time 6 -hls_playlist_type vod \
              -hls_segment_filename "hls_output/original/segmento_%03d.ts" \
              hls_output/original/playlist.m3u8
            printf '#EXTM3U\n#EXT-X-STREAM-INF:BANDWIDTH=800000\noriginal/playlist.m3u8\n' > hls_output/master.m3u8
          fi

      - name: Subir carpeta HLS a R2
        run: |
          aws s3 cp hls_output "s3://${{ secrets.R2_BUCKET }}/hls/${{ matrix.video.id }}/" \
            --recursive \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      - name: Borrar el archivo crudo de R2 (ya no hace falta)
        if: success()
        run: |
          aws s3 rm "s3://${{ secrets.R2_BUCKET }}/$OBJECT_KEY" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
