name: Convertir video a HLS

on:
  repository_dispatch:
    types: [convertir_video]

jobs:
  convertir:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        video_id: ${{ fromJson(toJson(github.event.client_payload.video_ids)) }}
    steps:
      - name: Instalar ffmpeg y jq
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg jq

      - name: Instalar AWS CLI (para hablar con R2)
        run: |
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install

      - name: Configurar credenciales de R2
        run: |
          mkdir -p ~/.aws
          cat <<CREDS > ~/.aws/credentials
          [default]
          aws_access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CREDS
          echo "[default]" > ~/.aws/config
          echo "region = auto" >> ~/.aws/config

      - name: Pedirle al sitio los datos de este video
        run: |
          curl -sf "https://vixyra.vip/api-conversion.php?id=${{ matrix.video_id }}" \
            -H "X-Secret: ${{ secrets.CONVERT_SECRET }}" \
            -o info.json
          cat info.json

      - name: Descargar el mp4 crudo desde R2
        run: |
          OBJECT_KEY=$(jq -r '.video_object_key' info.json)
          echo "OBJECT_KEY=$OBJECT_KEY" >> "$GITHUB_ENV"
          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/$OBJECT_KEY" video_original.mp4 \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      - name: Convertir a HLS con ffmpeg
        run: |
          mkdir -p hls_output
          ffmpeg -i video_original.mp4 \
            -c:v libx264 -preset veryfast -crf 22 \
            -c:a aac -b:a 128k \
            -hls_time 6 -hls_playlist_type vod \
            -hls_segment_filename "hls_output/segmento_%03d.ts" \
            hls_output/playlist.m3u8

      - name: Subir carpeta HLS a R2
        run: |
          aws s3 cp hls_output "s3://${{ secrets.R2_BUCKET }}/hls/${{ matrix.video_id }}/" \
            --recursive \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          echo "HLS_KEY=hls/${{ matrix.video_id }}/playlist.m3u8" >> "$GITHUB_ENV"

      - name: Borrar el mp4 crudo de R2 (ya no hace falta)
        if: success()
        run: |
          aws s3 rm "s3://${{ secrets.R2_BUCKET }}/$OBJECT_KEY" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      - name: Avisarle al sitio que ya terminó
        if: always()
        run: |
          ESTADO="listo"
          if [ "${{ job.status }}" != "success" ]; then ESTADO="error"; fi
          curl -s -X POST "https://vixyra.vip/api-conversion.php" \
            -H "Content-Type: application/json" \
            -H "X-Secret: ${{ secrets.CONVERT_SECRET }}" \
            -d "{\"video_id\": ${{ matrix.video_id }}, \"status\": \"$ESTADO\", \"hls_key\": \"$HLS_KEY\"}"
